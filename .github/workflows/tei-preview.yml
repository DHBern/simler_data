name: TEI Preview
# Render every TEI file under webdav/data/sources/tei to HTML

on:
  workflow_run:
    workflows: ["WebDAV Export"]
    types: [completed]
  push:
    branches: [main]
    paths:
      - "webdav/data/sources/tei/**"
      - "gsheet/csv/**"
      - "schema/**"
      - "preview/**"
      - ".github/workflows/tei-preview.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# One render at a time; a queued run would only rebuild the same corpus
concurrency:
  group: tei-preview
  cancel-in-progress: false

jobs:
  render:
    # A failed export left the corpus untouched or half-written — nothing to render
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: preview

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: preview/package-lock.json

      - run: npm ci
      - run: npm run build

      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: preview/dist

  deploy:
    needs: render
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
