name: Schema to WebDAV
# Compile schema/tei_simler.odd to the RELAX NG and Schematron schemas the editors
# validate against, and put them into /schema/ on the WebDAV, beside the sources.
# The WebDAV Export brings them back into webdav/data/schema/.

on:
  push:
    branches: [main]
    paths:
      - "schema/tei_simler.odd"
      - ".github/workflows/schema-webdav.yml"
  workflow_dispatch:

# Only the newest ODD matters
concurrency:
  group: schema-webdav
  cancel-in-progress: true

jobs:
  schema:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Pinned, so a schema changes only when the ODD does
      - name: Fetch tools
        run: |
          set -euo pipefail
          mkdir -p tools && cd tools
          curl -fsSL -o jing.jar https://repo1.maven.org/maven2/org/relaxng/jing/20241231/jing-20241231.jar
          curl -fsSL -o saxon.jar https://repo1.maven.org/maven2/net/sf/saxon/Saxon-HE/12.9/Saxon-HE-12.9.jar
          curl -fsSL -o xmlresolver.jar https://repo1.maven.org/maven2/org/xmlresolver/xmlresolver/5.3.3/xmlresolver-5.3.3.jar
          curl -fsSL -o tei_odds.rng https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/custom/schema/relaxng/tei_odds.rng
          curl -fsSL -o p5subset.xml https://www.tei-c.org/Vault/P5/4.12.0/xml/tei/odd/p5subset.xml
          curl -fsSL -o stylesheets.zip https://github.com/TEIC/Stylesheets/releases/download/v7.61.0/tei-xsl-7.61.0.zip
          unzip -q stylesheets.zip -d stylesheets

      - name: Check the ODD
        run: java -jar tools/jing.jar tools/tei_odds.rng schema/tei_simler.odd

      - name: Compile
        run: |
          set -euo pipefail
          saxon() { java -cp tools/saxon.jar:tools/xmlresolver.jar net.sf.saxon.Transform "$@"; }
          odds=tools/stylesheets/xml/tei/stylesheet/odds
          saxon -xsl:$odds/odd2odd.xsl -s:schema/tei_simler.odd -o:out/compiled.odd defaultSource=file://$PWD/tools/p5subset.xml
          saxon -xsl:$odds/odd2relax.xsl -s:out/compiled.odd -o:out/tei_simler.rng
          saxon -xsl:$odds/extract-isosch.xsl -s:out/compiled.odd -o:out/tei_simler.sch
          # jing without documents checks the grammar itself
          java -jar tools/jing.jar out/tei_simler.rng

      # Inspectable, even when the upload fails
      - uses: actions/upload-artifact@v4
        with:
          name: schema
          path: out/tei_simler.*

      - name: Upload to the WebDAV
        env:
          WEBDAV_URL: ${{ secrets.WEBDAV_HOST }}
          WEBDAV_USERNAME: ${{ secrets.WEBDAV_USERNAME }}
          WEBDAV_PASSWORD: ${{ secrets.WEBDAV_PASSWORD }}
        run: |
          set -euo pipefail
          for file in tei_simler.rng tei_simler.sch; do
            curl -fsS --retry 3 --retry-delay 5 -u "$WEBDAV_USERNAME:$WEBDAV_PASSWORD" \
              -T "out/$file" "$WEBDAV_URL/schema/$file"
          done
